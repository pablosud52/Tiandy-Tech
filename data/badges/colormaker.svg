<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente lineal arcoíris para el texto "color" -->
    <linearGradient id="rainbow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0033" />
      <stop offset="20%" stop-color="#ff9900" />
      <stop offset="40%" stop-color="#ffcc00" />
      <stop offset="60%" stop-color="#00cc44" />
      <stop offset="80%" stop-color="#0099ff" />
      <stop offset="100%" stop-color="#6600cc" />
    </linearGradient>
    <filter id="glow-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#glow-shadow)">
    <!-- Texto "color" en multi-líneas concéntricas / rayado arcoíris -->
    <g font-family="system-ui, -apple-system, 'Arial Rounded MT Bold', sans-serif" font-weight="900" font-size="64" letter-spacing="-1">
      <!-- Trazo exterior arcoíris -->
      <text x="120" y="65" text-anchor="middle" fill="none" stroke="url(#rainbow-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">color</text>
      <!-- Trazo intermedio blanco para separación de bandas -->
      <text x="120" y="65" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="4">color</text>
      <!-- Trazo interior arcoíris continuo -->
      <text x="120" y="65" text-anchor="middle" fill="url(#rainbow-grad)">color</text>
    </g>

    <!-- Subtexto "maker" en tipografía bold con tracking ancho -->
    <text x="120" y="105" text-anchor="middle" font-family="system-ui, -apple-system, Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="6" fill="#111827">
      maker
    </text>
  </g>
</svg>
