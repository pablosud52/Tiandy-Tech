<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="100%" height="100%">
  <defs>
    <linearGradient id="smd2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="smd2-shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <g filter="url(#smd2-shadow)">
    <!-- Contenedor redondeado tipo badge tech -->
    <rect x="4" y="6" width="212" height="68" rx="20" fill="url(#smd2-grad)" stroke="#ffffff" stroke-width="2.5" />
    
    <!-- Isotipo IA / Red Neuronal humana y vehicular -->
    <g transform="translate(18, 18)" stroke="#ffffff" fill="none" stroke-width="2.2" stroke-linecap="round">
      <circle cx="14" cy="14" r="5" fill="#c4b5fd" />
      <circle cx="30" cy="14" r="5" fill="#c4b5fd" />
      <circle cx="22" cy="30" r="6" fill="#ffffff" />
      <line x1="14" y1="14" x2="22" y2="30" stroke="#ffffff" stroke-width="2" />
      <line x1="30" y1="14" x2="22" y2="30" stroke="#ffffff" stroke-width="2" />
      <line x1="14" y1="14" x2="30" y2="14" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,2" />
    </g>

    <!-- Tipografía SMD 2.0 -->
    <text x="75" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="1">
      SMD <tspan fill="#fbcfe8" font-size="28">2.0</tspan>
    </text>
    
    <text x="76" y="62" font-family="system-ui, -apple-system, Roboto, sans-serif" font-weight="700" font-size="9" fill="#ddd6fe" letter-spacing="1.5">
      HUMAN &amp; VEHICLE IA
    </text>
  </g>
</svg>
