<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="100%" height="100%">
  <defs>
    <linearGradient id="smd3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="smd3-shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <g filter="url(#smd3-shadow)">
    <!-- Contenedor redondeado tipo badge tech con borde dorado sutil -->
    <rect x="4" y="6" width="212" height="68" rx="20" fill="url(#smd3-grad)" stroke="#ffffff" stroke-width="2.5" />
    
    <!-- Isotipo IA de 3ra Generación con destellos -->
    <g transform="translate(16, 17)" stroke="#ffffff" fill="none" stroke-width="2" stroke-linecap="round">
      <polygon points="22,6 36,14 36,30 22,38 8,30 8,14" stroke="#60a5fa" fill="rgba(255,255,255,0.1)" stroke-width="1.8" />
      <circle cx="22" cy="22" r="5" fill="#facc15" stroke="#ffffff" stroke-width="1.5" />
      <path d="M 22,10 L 22,17 M 22,27 L 22,34 M 12,22 L 17,22 M 27,22 L 32,22" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Tipografía SMD 3.0 -->
    <text x="75" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="1">
      SMD <tspan fill="#facc15" font-size="28">3.0</tspan>
    </text>
    
    <text x="76" y="62" font-family="system-ui, -apple-system, Roboto, sans-serif" font-weight="700" font-size="9" fill="#93c5fd" letter-spacing="1.5">
      DEEP LEARNING PRO
    </text>
  </g>
</svg>
