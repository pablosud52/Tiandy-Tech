<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 68" width="100%" height="100%">
  <defs>
    <linearGradient id="smd3-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="smd3-shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <g filter="url(#smd3-shadow)">
    <!-- Contenedor grafito oscuro con borde verde Tiandy -->
    <rect x="4" y="4" width="192" height="60" rx="18" fill="url(#smd3-dark-grad)" stroke="#00A859" stroke-width="2.5" />
    
    <!-- Texto SMD 3.0 completamente blanco puro -->
    <text x="100" y="44" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="1.2">
      SMD 3.0
    </text>
  </g>
</svg>
