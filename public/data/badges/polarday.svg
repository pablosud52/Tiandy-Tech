<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 90" width="100%" height="100%">
  <defs>
    <!-- Gradiente verde lima radiante -->
    <linearGradient id="polar-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="50%" stop-color="#00cc44" />
      <stop offset="100%" stop-color="#009933" />
    </linearGradient>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- Texto "Polar" -->
    <text x="10" y="65" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="56" fill="url(#polar-green)" letter-spacing="-1">
      Polar
    </text>

    <!-- Símbolo solar / flor tecnológica entre Polar y day -->
    <g transform="translate(150, 48)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="url(#polar-green)" stroke-width="4" />
      <!-- Rayos de luz radiales -->
      <g stroke="url(#polar-green)" stroke-width="2.5" stroke-linecap="round">
        <line x1="0" y1="-14" x2="0" y2="-7" />
        <line x1="14" y1="0" x2="7" y2="0" />
        <line x1="0" y1="14" x2="0" y2="7" />
        <line x1="-14" y1="0" x2="-7" y2="0" />
        <line x1="10" y1="-10" x2="5" y2="-5" />
        <line x1="10" y1="10" x2="5" y2="5" />
        <line x1="-10" y1="10" x2="-5" y2="5" />
        <line x1="-10" y1="-10" x2="-5" y2="-5" />
      </g>
      <circle cx="0" cy="0" r="3" fill="url(#polar-green)" />
    </g>

    <!-- Texto "day" -->
    <text x="172" y="65" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="56" fill="url(#polar-green)" letter-spacing="-1">
      day
    </text>
  </g>
</svg>
