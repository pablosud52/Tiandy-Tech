<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="100%" height="100%">
  <defs>
    <linearGradient id="vca-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="vca-shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <g filter="url(#vca-shadow)">
    <!-- Contenedor redondeado tipo badge tech verde analítica -->
    <rect x="4" y="6" width="212" height="68" rx="20" fill="url(#vca-grad)" stroke="#ffffff" stroke-width="2.5" />
    
    <!-- Isotipo Perímetro / Tripwire / Mira de Analítica -->
    <g transform="translate(18, 18)" stroke="#ffffff" fill="none" stroke-width="2.2" stroke-linecap="round">
      <path d="M 8,16 L 8,8 L 16,8" stroke="#34d399" />
      <path d="M 28,8 L 36,8 L 36,16" stroke="#34d399" />
      <path d="M 36,28 L 36,36 L 28,36" stroke="#34d399" />
      <path d="M 16,36 L 8,36 L 8,28" stroke="#34d399" />
      <circle cx="22" cy="22" r="4" fill="#34d399" />
      <line x1="6" y1="22" x2="38" y2="22" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3" />
    </g>

    <!-- Tipografía VCA -->
    <text x="75" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="2">
      VCA
    </text>
    
    <text x="76" y="62" font-family="system-ui, -apple-system, Roboto, sans-serif" font-weight="700" font-size="9" fill="#a7f3d0" letter-spacing="1.5">
      VIDEO CONTENT ANALYTICS
    </text>
  </g>
</svg>
