<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="100%" height="100%">
  <defs>
    <linearGradient id="smd1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="smd1-shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <g filter="url(#smd1-shadow)">
    <!-- Contenedor redondeado tipo badge tech -->
    <rect x="4" y="6" width="212" height="68" rx="20" fill="url(#smd1-grad)" stroke="#ffffff" stroke-width="2.5" />
    
    <!-- Isotipo de movimiento inteligente / radar -->
    <g transform="translate(18, 18)" stroke="#ffffff" fill="none" stroke-width="2.2" stroke-linecap="round">
      <circle cx="22" cy="22" r="18" opacity="0.3" stroke-dasharray="3,3" />
      <circle cx="22" cy="22" r="11" opacity="0.7" />
      <circle cx="22" cy="22" r="4" fill="#ffffff" />
      <path d="M 22,4 L 22,8 M 22,36 L 22,40 M 4,22 L 8,22 M 36,22 L 40,22" />
    </g>

    <!-- Tipografía SMD 1.0 -->
    <text x="75" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="1">
      SMD <tspan fill="#38bdf8" font-size="28">1.0</tspan>
    </text>
    
    <text x="76" y="62" font-family="system-ui, -apple-system, Roboto, sans-serif" font-weight="700" font-size="9" fill="#bae6fd" letter-spacing="1.5">
      MOTION DETECTION
    </text>
  </g>
</svg>
